version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: thronely-db
    environment:
      POSTGRES_USER: thronely
      POSTGRES_PASSWORD: thronely_dev_password
      POSTGRES_DB: thronely
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thronely -d thronely"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thronely-app
    environment:
      DATABASE_URL: postgresql://thronely:thronely_dev_password@postgres:5432/thronely
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Add your Stripe keys here for local testing
      # STRIPE_SECRET_KEY: sk_test_...
      # STRIPE_WEBHOOK_SECRET: whsec_...
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

volumes:
  postgres_data: